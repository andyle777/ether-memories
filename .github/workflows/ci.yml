name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack
      - name: Verify packed consumer
        shell: bash
        run: |
          mkdir consumer
          cd consumer
          npm init -y
          npm install ../ether-memories-*.tgz
          node --input-type=module -e "import { mkdtemp, rm } from 'node:fs/promises'; import { tmpdir } from 'node:os'; import { join } from 'node:path'; import { EtherMemoriesCore } from 'ether-memories'; const dir = await mkdtemp(join(tmpdir(), 'ether-consumer-')); const path = join(dir, 'snapshot.json'); try { const e = new EtherMemoriesCore({userId:'ci', storagePath:path}); if (!e.addMemory({content:'package consumer'}).ok || !(await e.save()).ok) process.exit(1); const loaded = new EtherMemoriesCore({userId:'ci', storagePath:path}); if (!(await loaded.load()).ok || loaded.notes.getAll()[0]?.content !== 'package consumer') process.exit(1); } finally { await rm(dir, {recursive:true, force:true}); }"
