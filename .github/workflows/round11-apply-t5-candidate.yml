name: Round 11 Apply T5 Candidate

on:
  push:
    branches:
      - spike/v0.7.0-t5-windows-round11
    paths:
      - scripts/round11-apply-t5-production-patch.mjs

permissions:
  contents: write

jobs:
  apply-verified-candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/v0.7.0-t5-windows-round11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply guarded T5 codemod
        run: node scripts/round11-apply-t5-production-patch.mjs
      - name: Typecheck candidate
        run: npm run typecheck
      - name: Full regression suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit only verified production candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No production changes generated"
            exit 1
          fi
          git commit -m "feat(v0.7.0): add Windows process-recoverable durability profile"
          git push origin HEAD:spike/v0.7.0-t5-windows-round11
